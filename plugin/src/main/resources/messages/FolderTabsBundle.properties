settings.display.name=Folder Tabs
settings.enabled=Enable Folder Tabs
settings.enabled.comment=Show the directory / file tab header above every editor. Turning this off removes all headers; the standard editor tabs are never changed either way.
settings.group.label.depth=Group label depth:
settings.group.label.depth.comment=Number of directory levels shown in a group tab. Labels that reach the project root start with ~/ followed by the project name. Directories with the same name always get enough parents to tell them apart.
settings.group.label.depth.project.root=Project root
tab.close=Close
group.close=Close Group
action.FolderTabs.NextGroup.text=Next Folder Group
action.FolderTabs.NextGroup.description=Select the next directory group in the Folder Tabs header and open the file you last used there
action.FolderTabs.PreviousGroup.text=Previous Folder Group
action.FolderTabs.PreviousGroup.description=Select the previous directory group in the Folder Tabs header and open the file you last used there
action.FolderTabs.ToggleCollapsed.text=Collapse Folder Tabs
action.FolderTabs.ToggleCollapsed.description=Collapse the Folder Tabs header of this project to a single line; select again, or click the line, to expand it
header.expand=Expand Folder Tabs
