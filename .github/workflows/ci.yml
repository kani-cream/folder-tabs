name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'plan/**'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'plan/**'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/quality.yml
    with:
      upload-candidate: ${{ github.event_name == 'workflow_dispatch' }}

  quality-gate:
    name: Quality Gate
    needs: quality
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
