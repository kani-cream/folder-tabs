name: Compatibility

on:
  schedule:
    # Sunday 18:00 UTC (Monday ~03:00 JST). Detects IDE / Plugin Verifier side
    # changes without any code change (plan/github-actions-ci-design.md section 18).
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  quality:
    name: Scheduled Quality Check
    uses: ./.github/workflows/quality.yml
