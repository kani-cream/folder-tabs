name: Compatibility

on:
  schedule:
    # Sunday 18:00 UTC (Monday ~03:00 JST). Detects IDE / Plugin Verifier side
    # changes without any code change (plan/github-actions-ci-design.md section 18).
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    name: Scheduled Plugin Verification
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-excludes: |
            caches/**/transforms

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Plugin Verifier
        run: ./gradlew :plugin:verifyPlugin --no-daemon --stacktrace

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-plugin-verifier-reports
          path: plugin/build/reports/pluginVerifier/**
          if-no-files-found: ignore
          retention-days: 14
