name: UI Test

# Drives the real IDE, so it is slower than the Quality jobs and stays out of the Quality Gate.
# Runs on demand and when the UI tests themselves change.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'plugin/src/integrationTest/**'
      - '.github/workflows/ui-test.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-test:
    name: UI Test (${{ matrix.ide }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ide: ['2026.2.4', '263.7307.112']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-excludes: |
            caches/**/transforms

      - name: Start a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fluxbox
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          DISPLAY=:99 fluxbox &
          sleep 2

      - name: UI tests
        env:
          DISPLAY: ':99'
        run: ./gradlew :plugin:uiTest -PuiIdeVersion=${{ matrix.ide }} --stacktrace

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-${{ matrix.ide }}
          path: |
            plugin/build/reports/ui-screenshots/**
            plugin/build/reports/tests/uiTest/**
            out/ide-tests/tests/**/log/**
          if-no-files-found: ignore
          retention-days: 7
